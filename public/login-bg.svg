<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Main Diagonal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#7E22CE" />
      <stop offset="70%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Layer 1 Gradient -->
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Layer 2 Gradient -->
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Drop Shadow for Diagonal Layers -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Diagonal Slice 1 (Top Left Layer) -->
  <path d="M -200 800 L 450 -100 L -200 -100 Z" fill="url(#layer1)" filter="url(#shadow)" opacity="0.9" />

  <!-- Diagonal Slice 2 (Middle Layer) -->
  <path d="M 150 900 L 900 -100 L -100 900 Z" fill="url(#bgGrad)" filter="url(#shadow)" opacity="0.85" />

  <!-- Diagonal Slice 3 (Bottom Right Layer) -->
  <path d="M 600 900 L 1400 100 L 1400 900 Z" fill="url(#layer2)" filter="url(#shadowLight)" opacity="0.95" />
</svg>
